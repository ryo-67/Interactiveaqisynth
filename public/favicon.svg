<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- The tab icon follows the browser's own light or dark setting, not the page's sky (Shoro, 2026-09-17): cloud-sun drawn in the scene's ink on a light chrome, cloud-moon in white on a dark one. Both are Lucide, the same two the page uses, and the cloud is the same path in each so only the thing above it changes.
       One file rather than two <link media> tags, which Chromium does not honour for icons; an SVG favicon carries its own stylesheet and both engines re-evaluate it when the setting changes. The stroke is 2.25 rather than the icons' own 2: at 16 px a 24-unit glyph at 2 renders a 1.3 px line and reads faint against a tab strip. -->
  <style>
    .moon { display: none; }
    .sun, .moon { stroke: #05050a; }
    @media (prefers-color-scheme: dark) {
      .sun { display: none; }
      .moon { display: block; }
      .sun, .moon { stroke: #ffffff; }
    }
  </style>
  <g class="sun">
    <path d="M12 2v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="M20 12h2" />
    <path d="m19.07 4.93-1.41 1.41" />
    <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" />
    <path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z" />
  </g>
  <g class="moon">
    <path d="M10.188 8.5A6 6 0 0 1 16 4a1 1 0 0 0 6 6 6 6 0 0 1-3 5.197" />
    <path d="M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z" />
  </g>
</svg>
